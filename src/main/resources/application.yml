spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommercedb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must never alter it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Without both of these, an unmapped URL is served by Spring Boot's own
  # whitelabel error page/JSON — bypassing GlobalExceptionHandler entirely,
  # so it never gets the project's consistent ErrorResponse shape. Setting
  # both makes Spring throw NoHandlerFoundException instead, which
  # GlobalExceptionHandler.handleNoHandlerFound (Phase 15) now catches.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

springdoc:
  swagger-ui:
    # Alphabetical tag order (Auth, Brand, Cart, ...) instead of declaration
    # order, and endpoints within each tag sorted by HTTP method — makes the
    # ~20 tags in this API easy to scan instead of ordered by whatever
    # happened to be added to the Spring context first.
    tags-sorter: alpha
    operations-sorter: method
    # Persists the JWT pasted into "Authorize" across a page refresh, so
    # re-testing endpoints during development doesn't mean re-logging-in
    # every time.
    persist-authorization: true

app:
  jwt:
    # MUST be Base64-encoded — JwtService Base64-decodes this into the HS256 signing key.
    # The value below is a random dev-only key so the app runs out of the box; generate
    # your own with `openssl rand -base64 48` and override via APP_JWT_SECRET before
    # deploying anywhere real. Never commit a production secret to source control.
    secret: ${APP_JWT_SECRET:4qZjiWZLq7LWQKiVkC5LamxaRVXXrGSBGT0jYOSuhCsLWmKJWWQjWlmM5Z63SJXA}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

